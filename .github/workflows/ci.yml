name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Brand marks are in sync
        # src/render/brands.ts is generated from simple-icons and committed.
        # A dependency bump that changes a path must not land silently.
        run: |
          npm run brands
          git diff --exit-code src/render/brands.ts

  docker_build_check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          load: true
          tags: discord-presence-api:check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image serves /healthz
        run: |
          docker run -d --name check -e ALLOWED_USER_IDS=1 -p 8080:8080 discord-presence-api:check
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          docker rm -f check

      - name: Runtime image carries the VP9 alpha decoder
        # Animated nameplates fall back to the static plate without it.
        run: docker run --rm --entrypoint sh discord-presence-api:check -c 'ffmpeg -hide_banner -decoders 2>/dev/null | grep -q libvpx-vp9'
